[project]
name = "yt-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "apaks", email = "ap.akshay008@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.14.3",
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.1",
    "spacy>=3.8.14",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
yt-rag = "yt_rag:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
